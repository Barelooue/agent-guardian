# Agent Guardian — packaging & quality gates

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-guardian"
version = "0.2.0"
description = "Lightweight Human-in-the-Loop middleware for desktop/mobile agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Agent Guardian Contributors" }]
keywords = [
  "agent",
  "human-in-the-loop",
  "telegram",
  "browser-use",
  "middleware",
  "dpo",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "aiosqlite>=0.20",
  "websockets>=12.0",
  "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/Barelooue/agent-guardian"
Documentation = "https://github.com/Barelooue/agent-guardian#readme"
Issues = "https://github.com/Barelooue/agent-guardian/issues"
Changelog = "https://github.com/Barelooue/agent-guardian/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-Pillow>=10.0",
]
browser = [
  "playwright>=1.40",
]
browser-use = [
  "playwright>=1.40",
  "browser-use>=0.1.40",
]

[project.scripts]
agent-guardian = "agent_guardian.daemon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_guardian"]

# Include Web UI HTML/assets that sit beside Python modules.
[tool.hatch.build]
include = [
  "src/agent_guardian/**/*.py",
  "src/agent_guardian/daemon/static/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = [
  "RUF001",  # allow fullwidth punctuation in zh-CN UX strings
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Scripts bootstrap sys.path before package imports.
"scripts/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = false
warn_unused_ignores = true
packages = ["agent_guardian"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["browser_use", "browser_use.*"]
ignore_missing_imports = true
